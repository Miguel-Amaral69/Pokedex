<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokedex</title>
</head>
<body>
    
    <main>
        <img id="pkimg" class="pokemon_log" src="a" alt="pkemon">
        
        <h1>
            <span id="pknum" class="pokemon_number"></span>
            <span id="pkname" class="pokemon_name"></span>
        </h1>
        <form id="form" class="form>
            <input type="search" id="input" class="input_search" placeholder="Nome ou Numero" required>
        </form>

        <div class="buttons">
            <button id="but-prev" class="button">Prev &lt;</button>
            <button id="but-next" class="button">Next &gt;</button>
        </div>

        <img class="pokedex" src="pokedex.png" alt="Pokédex">

    </main>

</body>
</html>
